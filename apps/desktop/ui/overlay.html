<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>TypingRank Overlay</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      /* 창 배경은 완전 투명해야 한다. 여기가 사각형으로 보이면 투명 창이
         실패한 것이다 — Phase 0 스파이크에서 정상 동작을 확인했다. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
        font-family: var(--font-sans);
        color: var(--overlay-text);
      }

      /* anti-card 원칙대로 **표면은 하나뿐이다.** 오버레이는 임의의 배경 위에
         떠서 가독성을 위한 바탕이 반드시 필요하지만, 그 안에서 다시 박스를
         나누지 않는다. 내부 위계는 전부 타이포와 여백이 만든다. */
      .surface {
        margin: 8px;
        padding: 14px 16px;
        border-radius: var(--radius-lg);
        background: var(--overlay-surface);
        border: 1px solid var(--overlay-border);
        backdrop-filter: blur(14px);
        /* 투명 창에서는 **여백 밖으로 나가는 것이 전부 잘린다.**
           box-shadow는 바깥으로 blur의 절반 + offset만큼 퍼지므로
           (2 + 6/2 = 5px) 반드시 margin(8px) 안에 들어와야 한다.
           이걸 넘기면 그림자가 부드럽게 사라지지 못하고 창 경계에서
           잘려 딱딱한 사각형으로 보인다 — 실제로 그렇게 보였다. */
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
      }

      .eyebrow {
        color: var(--overlay-text-muted);
      }
      .count {
        margin: 4px 0 0;
        color: var(--overlay-text);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
      }

      .rows {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 3px 14px;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--overlay-border);
        color: var(--overlay-text-muted);
      }
      .rows dd {
        margin: 0;
        text-align: right;
        color: var(--overlay-text);
      }

      .hint {
        margin-top: 10px;
        color: var(--overlay-text-muted);
        opacity: 0.75;
      }

      .paused .count {
        color: var(--overlay-accent);
      }

      /* --- 표시 타입 -------------------------------------------------------
         창 크기는 Rust의 Variant::size()가 정한다. 여기 레이아웃을 고치면
         저 수치도 같이 봐야 한다 (src-tauri/src/overlay.rs). */

      /* 미니멀 — 게임 중용. 숫자만, 대신 크게.
         게임 중에는 흘끗 보는 게 전부라 작은 숫자는 없는 것과 같다. */
      body[data-variant="minimal"] .eyebrow,
      body[data-variant="minimal"] .rows,
      body[data-variant="minimal"] .hint {
        display: none;
      }
      body[data-variant="minimal"] .count {
        margin: 0;
        font-size: var(--fs-display-lg);
        line-height: var(--lh-display-lg);
        letter-spacing: var(--ls-display-lg);
      }

      /* 맥시멈에서만 나오는 행. 숨겨도 DOM 순번은 유지되므로 정렬이 안 깨진다. */
      .max-only {
        display: none;
      }
      body[data-variant="maximum"] .max-only {
        display: block;
      }
    </style>
  </head>
  <body data-variant="normal">
    <div class="surface" id="surface">
      <p class="t-eyebrow eyebrow">오늘</p>
      <p class="t-display tabular count" id="today">0</p>

      <dl class="rows t-small tabular">
        <dt>누적</dt>
        <dd id="total">0</dd>
        <dt>개인 기록</dt>
        <dd id="best">0</dd>
        <dt class="max-only">이번 실행</dt>
        <dd class="max-only" id="session">0</dd>
        <dt class="max-only">콜백 최대</dt>
        <dd class="max-only" id="cb">0 µs</dd>
      </dl>

      <p class="t-eyebrow hint">F7 타입 · F8 표시</p>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const n = (v) => v.toLocaleString();

      function paintSnapshot(s) {
        $("today").textContent = s.paused ? "일시정지" : n(s.today);
        $("total").textContent = n(s.total);
        $("best").textContent = n(s.best_day);
        $("session").textContent = n(s.session);
        $("cb").textContent = n(s.max_cb_us) + " µs";
        document.body.classList.toggle("paused", s.paused);
      }

      function paintState(o) {
        document.body.dataset.variant = o.variant;
      }

      window.__TAURI__.event.listen("snapshot", (e) => paintSnapshot(e.payload));
      window.__TAURI__.event.listen("overlay-state", (e) => paintState(e.payload));
    </script>
  </body>
</html>
